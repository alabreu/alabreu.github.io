<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Intentionally NO theme-color meta: a fixed theme-color paints an opaque
         bar behind the iOS Safari status bar (a black band on the Home screen).
         Without it, Safari tints that area from the page content, so the Home
         mesh gradient extends behind the status bar. -->
    <!-- theme-color intentionally omitted (see comment above) -->
    <title>Tutor Brew</title>

    <!-- PWA / iOS home screen -->
    <link rel="manifest" href="/mtg-deck-builder/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/mtg-deck-builder/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tutor Brew" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Young+Serif&family=Lora:wght@700&family=Bitter:wght@700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
  </head>
