<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Don't leak the URL (which briefly carries the auth token_hash on email
         links) to cross-origin destinations via the Referer header. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Honored by Safari < 26 (dark base). Safari 26+ ignores theme-color and
         instead samples the top fixed element's background-color — see
         .home-mesh-bg in index.css. -->
    <meta name="theme-color" content="#0f0f0f" />
    <title>Tutor Brew</title>

    <!-- SEO + social preview (Open Graph / Twitter) so shared links show a card.
         Absolute image URL on the github.io origin so it resolves from any
         domain (incl. tutor-brew.com via the Cloudflare proxy). -->
    <meta
      name="description"
      content="Monte decks de Commander de Magic: The Gathering com um tutor de IA — busca do Scryfall, categorias, estatísticas e sincronização na nuvem."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tutor Brew" />
    <meta property="og:title" content="Tutor Brew — deck builder de Commander com IA" />
    <meta
      property="og:description"
      content="Monte decks de Commander com um tutor de IA do seu lado: busca do Scryfall, categorias, estatísticas e decks na nuvem."
    />
    <meta property="og:url" content="https://tutor-brew.com" />
    <meta property="og:image" content="https://alabreu.github.io/mtg-deck-builder/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tutor Brew — deck builder de Commander com IA" />
    <meta
      name="twitter:description"
      content="Monte decks de Commander com um tutor de IA do seu lado."
    />
    <meta name="twitter:image" content="https://alabreu.github.io/mtg-deck-builder/icon-512.png" />

    <!-- PWA / iOS home screen -->
    <link rel="manifest" href="/mtg-deck-builder/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/mtg-deck-builder/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tutor Brew" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Young+Serif&family=Lora:wght@700&family=Bitter:wght@700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/mtg-deck-builder/assets/index-DrQmDm5E.js"></script>
    <link rel="stylesheet" crossorigin href="/mtg-deck-builder/assets/index-BDrCAher.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
