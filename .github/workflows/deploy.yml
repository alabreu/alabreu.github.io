name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mtg-deck-builder/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mtg-deck-builder

      - name: Build
        run: npm run build
        working-directory: mtg-deck-builder

      - name: Prepare site
        run: |
          mkdir -p _site/mtg-deck-builder
          rsync -av \
            --exclude='mtg-deck-builder' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='*.tar' \
            . _site/
          cp -r mtg-deck-builder/dist/* _site/mtg-deck-builder/
          touch _site/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          token: ${{ secrets.GITHUB_TOKEN }}
