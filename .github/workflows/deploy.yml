name: Deploy to GitHub Pages

on:
  schedule:
    # Hourly deploy — avoids the GitHub Pages ~10 builds/hour throttle
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    # Publica automaticamente quando o design-lab (ou o próprio pipeline)
    # muda. Escopo estreito de propósito: mudanças aqui são raras, então não
    # reintroduz o problema de throttle que fez desligar o deploy-on-push geral.
    paths:
      - 'design-lab/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mtg-deck-builder/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mtg-deck-builder

      - name: Build
        run: npm run build
        working-directory: mtg-deck-builder
        env:
          # Optional: only set once the Supabase project exists (see
          # mtg-deck-builder/docs/supabase-setup.md). Coach falls back to the
          # bring-your-own-key flow when these are absent.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional: only set once enrolled in TCGplayer's affiliate program
          # (see the comment above tcgplayerUrl() in src/lib/priceSource.ts).
          # Absent by default — price links stay plain (non-affiliate) links.
          VITE_TCGPLAYER_AFFILIATE_BASE: ${{ secrets.VITE_TCGPLAYER_AFFILIATE_BASE }}

      - name: Prepare site
        run: |
          mkdir -p _site/mtg-deck-builder
          rsync -av \
            --exclude='mtg-deck-builder' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='*.tar' \
            . _site/
          cp -r mtg-deck-builder/dist/* _site/mtg-deck-builder/
          touch _site/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          token: ${{ secrets.GITHUB_TOKEN }}
