name: Deploy to GitHub Pages

on:
  schedule:
    # Hourly deploy — avoids the GitHub Pages ~10 builds/hour throttle
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mtg-deck-builder/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mtg-deck-builder

      - name: Build
        run: npm run build
        working-directory: mtg-deck-builder
        env:
          # Optional: only set once the Supabase project exists (see
          # mtg-deck-builder/docs/supabase-setup.md). Coach falls back to the
          # bring-your-own-key flow when these are absent.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional: only set once enrolled in TCGplayer's affiliate program
          # (see the comment above tcgplayerUrl() in src/lib/priceSource.ts).
          # Absent by default — price links stay plain (non-affiliate) links.
          VITE_TCGPLAYER_AFFILIATE_BASE: ${{ secrets.VITE_TCGPLAYER_AFFILIATE_BASE }}

      - name: Prepare site
        run: |
          mkdir -p _site/mtg-deck-builder
          rsync -av \
            --exclude='mtg-deck-builder' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='*.tar' \
            . _site/
          cp -r mtg-deck-builder/dist/* _site/mtg-deck-builder/
          touch _site/.nojekyll

      # Dev preview: the working branch, published at /dev/ so in-progress
      # work can be tested from a phone without touching production. The
      # deploy action cleans the gh-pages branch each run, so /dev/ must be
      # rebuilt here every time or it would vanish within the hour.
      # continue-on-error: a broken dev branch must never block the
      # production deploy (only /dev/ goes stale until the branch is fixed).
      - name: Checkout dev branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: claude/plan-mtg-deckbuilder-9DKbA
          path: dev-src

      - name: Build dev preview
        continue-on-error: true
        run: npm ci && npm run build
        working-directory: dev-src/mtg-deck-builder
        env:
          VITE_BASE: /dev/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TCGPLAYER_AFFILIATE_BASE: ${{ secrets.VITE_TCGPLAYER_AFFILIATE_BASE }}

      - name: Add dev preview to site
        continue-on-error: true
        run: |
          mkdir -p _site/dev
          cp -r dev-src/mtg-deck-builder/dist/* _site/dev/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          token: ${{ secrets.GITHUB_TOKEN }}
