name: Refresh function tags

# Regenerates the function-grouping snapshot (mtg-deck-builder/public/functionTags.json)
# from Scryfall's community oracle tags. Runs monthly, and can be triggered by
# hand right after a new set releases. The commit lands on master and the
# existing hourly Pages deploy picks it up.

on:
  schedule:
    # 06:00 UTC on the 1st of each month.
    - cron: '0 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build snapshot from Scryfall
        working-directory: mtg-deck-builder
        run: node scripts/build-function-tags.mjs

      # Cards that override the singleton rule ("A deck can have any number of
      # cards named…"). continue-on-error: a Scryfall hiccup here must not stop
      # the function-tag refresh above from being committed — and the script
      # already refuses to blank the list on an empty answer.
      - name: Refresh "any number of copies" cards
        continue-on-error: true
        working-directory: mtg-deck-builder
        run: node scripts/build-any-number-cards.mjs

      - name: Commit if changed
        run: |
          FILES="mtg-deck-builder/public/functionTags.json mtg-deck-builder/src/features/deck-builder/anyNumberCards.ts"
          if git diff --quiet -- $FILES; then
            echo "No changes to the Scryfall snapshots."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: refresh Scryfall snapshots (function tags + any-number cards)"
          git push
